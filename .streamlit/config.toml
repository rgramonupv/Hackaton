# Style inspired by conservation.org: ozone paper, whale navy, forest/biodiversity greens,
# condensed uppercase display type (Barlow Condensed ~ Proxima Nova ExCn) + Montserrat (~ Proxima Nova).
[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#257422"
backgroundColor = "#FAF7F2"
secondaryBackgroundColor = "#EEECE9"
textColor = "#152D44"
greenColor = "#257422"
orangeColor = "#FC992F"
blueColor = "#0171A8"
linkColor = "#0171A8"
borderColor = "#DDD8CF"
showWidgetBorder = true
baseRadius = "4px"
buttonRadius = "4px"
baseFontSize = 16
font = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "'Barlow Condensed':https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 700, 700, 600, 600, 600]
metricValueFontSize = "2.4rem"
metricValueFontWeight = 700

[theme.sidebar]
backgroundColor = "#152D44"
secondaryBackgroundColor = "#1F3B57"
textColor = "#FAF7F2"
primaryColor = "#4BAA47"
borderColor = "#2C4A66"

[browser]
gatherUsageStats = false
