# Style inspired by conservation.org (shifted to green): ozone paper, deep pine green, forest/biodiversity greens,
# condensed uppercase display type (Barlow Condensed ~ Proxima Nova ExCn) + Montserrat (~ Proxima Nova).
[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#257422"
backgroundColor = "#F1F6EE"
secondaryBackgroundColor = "#E2ECDD"
textColor = "#133A24"
greenColor = "#257422"
orangeColor = "#FC992F"
blueColor = "#257422"
linkColor = "#257422"
borderColor = "#CFDCC8"
showWidgetBorder = true
baseRadius = "4px"
buttonRadius = "4px"
baseFontSize = 16
font = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "'Barlow Condensed':https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 700, 700, 600, 600, 600]
metricValueFontSize = "2.4rem"
metricValueFontWeight = 700

[theme.sidebar]
backgroundColor = "#133A24"
secondaryBackgroundColor = "#1E4D31"
textColor = "#FAF7F2"
primaryColor = "#4BAA47"
borderColor = "#2D5E3F"

[browser]
gatherUsageStats = false
